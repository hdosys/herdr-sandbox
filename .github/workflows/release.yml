name: Release

on:
  push:
    tags:
      - "v0.0.*"

permissions:
  contents: write

jobs:
  release:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate release tag
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v0\.0\.(0|[1-9][0-9]*)$') {
              throw "Release tag must match v0.0.RELEASE_ID without leading zeroes: $env:RELEASE_TAG"
          }
      - name: Run checked build
        shell: powershell
        run: go run ./cmd/task verify-integration
      - name: Prepare current stable NSIS compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = @(& winget.exe show --id NSIS.NSIS --exact --source winget --architecture x86 --installer-type nullsoft --scope machine --accept-source-agreements --disable-interactivity 2>&1 | ForEach-Object { [string]$_ })
          if ($LASTEXITCODE -ne 0) {
              throw "NSIS metadata resolution failed with exit code $LASTEXITCODE."
          }
          $versions = @($metadata | Where-Object { $_ -match '^Version:\s*(\S+)\s*$' } | ForEach-Object { $Matches[1] })
          $urls = @($metadata | Where-Object { $_ -match '^\s*Installer Url:\s*(\S+)\s*$' } | ForEach-Object { $Matches[1] })
          $hashes = @($metadata | Where-Object { $_ -match '^\s*Installer SHA256:\s*([A-Fa-f0-9]{64})\s*$' } | ForEach-Object { $Matches[1] })
          if ($versions.Count -ne 1 -or $versions[0] -notmatch '^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:\.(?:0|[1-9][0-9]*))?$' -or
              $urls.Count -ne 1 -or $hashes.Count -ne 1) {
              throw 'NSIS metadata did not resolve one stable version, installer URL, and digest.'
          }
          $resolvedVersion = $versions[0]
          $installerURL = [string]$urls[0]
          $expectedURLPrefix = "https://sourceforge.net/projects/nsis/files/NSIS%203/$resolvedVersion/"
          if (-not $installerURL.StartsWith($expectedURLPrefix, [StringComparison]::Ordinal) -or
              -not $installerURL.EndsWith("/nsis-$resolvedVersion-setup.exe/download", [StringComparison]::Ordinal)) {
              throw "NSIS installer URL is unexpected: $installerURL"
          }
          $installer = Join-Path $env:RUNNER_TEMP "nsis-$resolvedVersion-setup.exe"
          $curl = Join-Path $env:SystemRoot 'System32\curl.exe'
          & $curl --fail --location --silent --show-error --output $installer $installerURL
          if ($LASTEXITCODE -ne 0) { throw "NSIS download failed with exit code $LASTEXITCODE." }
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualHash -ine [string]$hashes[0]) {
              throw "NSIS installer SHA-256 = $actualHash, expected $($hashes[0])"
          }
          $installProcess = Start-Process -FilePath $installer -ArgumentList @('/S') -WindowStyle Hidden -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
              throw "NSIS installation failed with exit code $($installProcess.ExitCode)."
          }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
              throw "NSIS compiler was not found at $compiler"
          }
          $actualVersion = (& $compiler /VERSION).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualVersion -cne "v$resolvedVersion") {
              throw "NSIS compiler version = '$actualVersion', expected v$resolvedVersion"
          }
          "MAKENSIS=$compiler" | Add-Content -Path $env:GITHUB_ENV
      - name: Package Windows release
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: go run ./cmd/task package $env:RELEASE_TAG
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem -LiteralPath 'build\dist' -File | Sort-Object Name)
          if ($assets.Count -ne 2) {
              throw "Expected exactly two release assets, found $($assets.Count)."
          }
          $installers = @($assets | Where-Object { $_.Name.EndsWith('_setup.exe', [StringComparison]::Ordinal) })
          if ($installers.Count -ne 1) {
              throw "Expected exactly one installer asset, found $($installers.Count)."
          }
          $productName = [string]$installers[0].VersionInfo.ProductName
          if ([string]::IsNullOrWhiteSpace($productName)) {
              throw 'Installer ProductName is missing.'
          }
          $releaseNotes = (& go run ./cmd/task release-notes $env:RELEASE_TAG) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseNotes)) {
              throw 'Tagged changelog link generation failed.'
          }
          $arguments = @('release', 'create', $env:RELEASE_TAG) + @($assets.FullName) + @(
              '--verify-tag',
              '--notes', $releaseNotes,
              '--title', "$productName $env:RELEASE_TAG"
          )
          & gh.exe @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
          $published = (& gh.exe release view $env:RELEASE_TAG --json assets) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release asset lookup failed with exit code $LASTEXITCODE."
          }
          foreach ($asset in $assets) {
              $matches = @($published.assets | Where-Object { $_.name -ceq $asset.Name })
              $expectedDigest = 'sha256:' + (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($matches.Count -ne 1 -or [string]$matches[0].digest -cne $expectedDigest) {
                  throw "GitHub release asset digest did not match $($asset.Name)."
              }
          }
