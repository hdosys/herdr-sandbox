name: Release

on:
  push:
    tags:
      - "v0.0.*"

permissions:
  contents: write

env:
  NSIS_VERSION: "3.12"
  NSIS_URL: https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip
  NSIS_SHA256: 56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f

jobs:
  release:
    name: Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate release tag
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v0\.0\.(0|[1-9][0-9]*)$') {
              throw "Release tag must match v0.0.RELEASE_ID without leading zeroes: $env:RELEASE_TAG"
          }
      - name: Run checked build
        shell: powershell
        run: go run ./cmd/task check
      - name: Prepare pinned NSIS compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "nsis-$($env:NSIS_VERSION).zip"
          $destination = Join-Path $env:RUNNER_TEMP 'nsis'
          $curl = Join-Path $env:SystemRoot 'System32\curl.exe'
          if (-not (Test-Path -LiteralPath $curl -PathType Leaf)) {
              throw "System curl.exe was not found at $curl"
          }
          & $curl --fail --location --silent --show-error --output $archive $env:NSIS_URL
          if ($LASTEXITCODE -ne 0) {
              throw "NSIS archive download failed with exit code $LASTEXITCODE."
          }
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:NSIS_SHA256) {
              throw "NSIS archive SHA-256 = $actualHash, expected $($env:NSIS_SHA256)"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $compiler = Join-Path $destination "nsis-$($env:NSIS_VERSION)\makensis.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
              throw "Pinned NSIS compiler was not found at $compiler"
          }
          $actualVersion = (& $compiler /VERSION).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualVersion -cne "v$($env:NSIS_VERSION)") {
              throw "NSIS compiler version = '$actualVersion', expected v$($env:NSIS_VERSION)"
          }
          "MAKENSIS=$compiler" | Add-Content -Path $env:GITHUB_ENV
      - name: Package Windows release
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: go run ./cmd/task package $env:RELEASE_TAG
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseName = "herdr-sandbox_$($env:RELEASE_TAG)_windows_amd64"
          $assets = @(
              "build\dist\$baseName.zip",
              "build\dist\$baseName.zip.sha256",
              "build\dist\$($baseName)_setup.exe",
              "build\dist\$($baseName)_setup.exe.sha256"
          )
          $arguments = @('release', 'create', $env:RELEASE_TAG) + $assets + @(
              '--verify-tag',
              '--generate-notes',
              '--title', "herdr-sandbox $env:RELEASE_TAG"
          )
          & gh.exe @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }
